<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#222" rx="16" />
  <!-- Handle -->
  <path d="M190,200 C240,200 240,260 190,260" fill="none" stroke="#f7f3ed" stroke-width="16" stroke-linecap="round" />
  <!-- Mug Body -->
  <rect x="100" y="170" width="100" height="110" rx="12" fill="#f7f3ed" />
  <!-- Coffee Inside (top perspective ellipse) -->
  <ellipse cx="150" cy="170" rx="50" ry="16" fill="#e0d3c1" />
  <ellipse cx="150" cy="170" rx="42" ry="10" fill="#3d1e0b" />
  <!-- Logo Mark on Mug -->
  <circle cx="150" cy="235" r="16" fill="#222" />
  <circle cx="150" cy="235" r="14" fill="#d49a46" />
  <!-- Steam -->
  <path d="M135,140 Q130,120 140,110 T135,80" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M165,145 Q170,125 160,115 T165,85" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  <text x="150" y="360" fill="#f3d08c" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Signature Ceramic Mug</text>
</svg>