<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mokaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f6f8" />
    </linearGradient>

    <!-- Cyan / Teal Gradient -->
    <linearGradient id="mokaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4DF" />
      <stop offset="100%" stop-color="#009BB0" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="mokaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B75BC" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001529" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Card Background -->
  <rect width="500" height="500" rx="32" fill="url(#mokaBg)" />

  <!-- Logo Mark Group -->
  <g filter="url(#dropShadow)" transform="translate(150, 90)">
    <!-- Right / Background Arch Block (Dark Blue) -->
    <path d="M 125 0 
             L 165 0 
             C 184.3 0 200 15.7 200 35 
             L 200 165 
             C 200 184.3 184.3 200 165 200 
             L 125 200 
             C 105.7 200 90 184.3 90 165 
             L 90 35 
             C 90 15.7 105.7 0 125 0 Z" fill="url(#mokaBlue)" />

    <!-- Left / Foreground Arch Block (Moka Cyan) -->
    <path d="M 35 0 
             L 75 0 
             C 94.3 0 110 15.7 110 35 
             L 110 165 
             C 110 184.3 94.3 200 75 200 
             L 35 200 
             C 15.7 200 0 184.3 0 165 
             L 0 35 
             C 0 15.7 15.7 0 35 0 Z" fill="url(#mokaCyan)" />

    <!-- Connecting Bridge / Crossbar Curve -->
    <path d="M 35 70 
             L 165 70 
             C 184.3 70 200 85.7 200 105 
             L 200 130 
             C 200 110.7 184.3 95 165 95 
             L 35 95 
             C 15.7 95 0 110.7 0 130 
             L 0 105 
             C 0 85.7 15.7 70 35 70 Z" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Typography: "moka" -->
  <text x="250" y="365" fill="#0F2027" font-family="&#39;Inter&#39;, &#39;Montserrat&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" text-anchor="middle">moka</text>

  <!-- Tagline: "POINT OF SALE" -->
  <text x="250" y="405" fill="#00A8BC" font-family="&#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="16" font-weight="700" letter-spacing="6" text-anchor="middle">POINT OF SALE</text>
</svg>