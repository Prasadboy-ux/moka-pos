<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#222" rx="16" />
  <!-- Glass Cup -->
  <polygon points="85,110 215,110 200,350 100,350" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <!-- Dark Iced Coffee -->
  <polygon points="101,348 199,348 212,120 88,120" fill="#24140b" />
  <!-- Floating Ice Cubes -->
  <rect x="105" y="130" width="35" height="30" rx="4" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.6)" transform="rotate(10 120 145)" />
  <rect x="150" y="140" width="38" height="32" rx="4" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.6)" transform="rotate(-15 170 155)" />
  <rect x="120" y="180" width="32" height="28" rx="4" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" />
  <!-- Straw -->
  <line x1="185" y1="50" x2="160" y2="340" stroke="#111" stroke-width="8" stroke-linecap="round" />
  <text x="150" y="380" fill="#f3d08c" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Iced Americano</text>
</svg>