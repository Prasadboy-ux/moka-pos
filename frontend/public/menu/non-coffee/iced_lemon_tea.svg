<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#222" rx="0" />
  <!-- Glass Cup -->
  <polygon points="85,110 215,110 200,350 100,350" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <!-- Amber Tea Liquid -->
  <polygon points="101,348 199,348 212,120 88,120" fill="#c97818" />
  <!-- Lemon Slice -->
  <circle cx="120" cy="140" r="22" fill="#ffd500" stroke="#fff" stroke-width="2" />
  <circle cx="120" cy="140" r="17" fill="#ffe866" />
  <!-- Ice Cubes -->
  <rect x="145" y="135" width="35" height="30" rx="4" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.7)" transform="rotate(-8 160 150)" />
  <rect x="110" y="180" width="32" height="28" rx="4" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.6)" />
  <!-- Straw -->
  <line x1="185" y1="50" x2="160" y2="340" stroke="#111" stroke-width="8" stroke-linecap="round" />
  </svg>
