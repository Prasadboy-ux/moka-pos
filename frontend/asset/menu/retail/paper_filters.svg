<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#222" rx="16" />
  <!-- Box Body -->
  <rect x="100" y="170" width="100" height="110" fill="#d49a46" />
  <!-- Box Lid/Flap (Perspective) -->
  <path d="M100,170 L120,140 L220,140 L200,170 Z" fill="#e3b168" />
  <!-- Box Side -->
  <path d="M200,170 L220,140 L220,250 L200,280 Z" fill="#a66e24" />
  <!-- Filter paper sticking out of top -->
  <path d="M130,145 L180,145 L155,100 Z" fill="#f7f3ed" stroke="#e0d3c1" stroke-width="2" />
  <!-- Box Label -->
  <rect x="120" y="200" width="60" height="40" fill="#fffefb" rx="2" />
  <path d="M135,220 L165,220 L150,235 Z" fill="#222" />
  <text x="150" y="360" fill="#f3d08c" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Paper Filters (100ct)</text>
</svg>