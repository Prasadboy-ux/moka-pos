<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#222" rx="16" />
  <!-- Base Glass Carafe -->
  <polygon points="135,210 165,210 195,290 105,290" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <path d="M105,290 Q150,310 195,290" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <!-- Coffee in Carafe -->
  <polygon points="115,260 185,260 192,288 108,288" fill="#3d1e0b" />
  <path d="M108,288 Q150,305 192,288" fill="#3d1e0b" />
  <!-- Wood Collar & Leather Tie -->
  <rect x="130" y="195" width="40" height="15" rx="3" fill="#a87139" />
  <circle cx="170" cy="202" r="4" fill="#e3b168" /> 
  <!-- Top Glass Cone -->
  <polygon points="100,120 200,120 150,195" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  <!-- Paper Filter Inside Cone -->
  <polygon points="110,120 190,120 150,190" fill="#f7f3ed" />
  <text x="150" y="360" fill="#f3d08c" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Pour-Over Carafe</text>
</svg>