<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#222" rx="16" />
  <!-- Cake Slice Side -->
  <polygon points="100,280 230,280 230,190 100,240" fill="#f7e6b5" />
  <!-- Burnt Top -->
  <polygon points="90,240 100,240 230,190 200,160 80,210" fill="#522f18" />
  <path d="M100,240 L230,190" stroke="#402310" stroke-width="4" />
  <!-- Crust Base -->
  <polygon points="100,280 230,280 240,290 90,290" fill="#b07f43" />
  <text x="150" y="360" fill="#f3d08c" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Basque Cheesecake</text>
</svg>